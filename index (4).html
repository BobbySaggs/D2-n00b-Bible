<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2 n00b Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Single dark theme: a Guardian HUD. Accent is Tyler's brand blue. Layout: controls column + results column. */
  --bg: #0d0f17; --panel: #151826; --panel-2: #1c2033; --line: #2a3050;
  --ink: #e6e8f2; --ink-dim: #9aa1bd; --accent: #485cc7; --accent-hi: #7183e6;
  --good: #3fb57f; --warn: #d9a441; --bad: #d65f5f; --exo: #e9c46a;
  --solar: #f08a2c; --void: #a46ae0; --arc: #5fc7e8; --strand: #4fc36e; --stasis: #6b8cf0; --prismatic: #e3a6e8;
  --display: "Rajdhani", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 700; letter-spacing: .02em; margin: 0; text-wrap: balance; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 2px; }
a { color: var(--accent-hi); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px 60px; }
header.top { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 18px 0 12px; border-bottom: 1px solid var(--line); }
.brand h1 { font-size: 28px; text-transform: uppercase; }
.brand p { margin: 2px 0 0; color: var(--ink-dim); font-size: 13px; }
.clspick { display: flex; gap: 6px; margin-left: auto; }
.clspick:empty { display: none; }
.clspick button { font: inherit; font-size: 13px; font-weight: 600; color: var(--dim, #9aa); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.clspick button[aria-pressed="true"] { color: #fff; background: var(--accent); border-color: var(--accent); }
.clspick button small { display: block; font-weight: 400; font-size: 11px; opacity: .8; }
.power { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.power b { font-family: var(--display); font-size: 24px; color: var(--accent-hi); font-variant-numeric: tabular-nums; }
.power .bar { width: 120px; height: 6px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.power .bar i { display: block; height: 100%; background: var(--accent); }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 14px 0; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; color: var(--ink-dim); font-family: var(--display); font-size: 17px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.hidden { display: none !important; }
.layout { display: grid; grid-template-columns: 330px 1fr; gap: 18px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.controls { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; }
.lbl { display: block; font-family: var(--display); text-transform: uppercase; letter-spacing: .07em; font-size: 13px; color: var(--ink-dim); margin-bottom: 6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { background: none; border: 0; border-radius: 7px; padding: 8px 4px; font-family: var(--display); font-weight: 700; font-size: 16px; text-transform: uppercase; color: var(--ink-dim); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.blist { display: flex; flex-direction: column; gap: 6px; }
.blist button { background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--el, var(--accent)); border-radius: 8px; padding: 8px 10px; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 0 8px; }
.blist button[aria-pressed="true"] { border-color: var(--accent); border-left-color: var(--el); background: #232a4a; }
.blist .n { font-weight: 600; font-size: 14px; }
.blist .f { font-family: var(--display); font-weight: 700; color: var(--accent-hi); }
.blist .m { grid-column: 1 / -1; font-size: 12px; color: var(--ink-dim); }
select { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; font-size: 13px; }
.lockrow { display: grid; grid-template-columns: 58px 1fr; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 13px; }
.lockrow span { color: var(--ink-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: 13px; }
.chip button { background: none; border: 0; color: var(--bad); padding: 0 0 0 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; }
.pill.el { color: var(--el); border-color: var(--el); }
.pill.good { color: var(--good); border-color: var(--good); }
.pill.warn { color: var(--warn); border-color: var(--warn); }
.pill.bad { color: var(--bad); border-color: var(--bad); }
.pill.acc { color: var(--accent-hi); border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
details.panel summary.sumh { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: .05em; }
details.panel summary.sumh::marker { color: var(--accent-hi); }
.bestgrid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; align-items: start; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.sec-h h3 { font-size: 18px; text-transform: uppercase; letter-spacing: .06em; }
.sec-h small, .dim { color: var(--ink-dim); }
.d12 { color: var(--ink-dim); font-size: 12px; }
.hero { border-top: 3px solid var(--el); display: flex; flex-wrap: wrap; gap: 12px 18px; justify-content: space-between; }
.hero h2 { font-size: 28px; margin-top: 6px; }
.hero p { margin: 4px 0 0; color: var(--ink-dim); max-width: 62ch; }
.actions { display: flex; flex-direction: column; gap: 8px; min-width: 230px; }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; background: var(--accent); border: 0; border-radius: 8px; padding: 9px 14px; font-weight: 600; color: #fff; text-decoration: none; }
.btn:hover { background: var(--accent-hi); }
.btn.ghost { background: transparent; border: 1px solid var(--accent); color: var(--accent-hi); }
.btn.sm { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn.warn { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
.stats { display: grid; gap: 8px; }
.stat { display: grid; grid-template-columns: 70px 1fr 38px; gap: 10px; align-items: center; font-size: 13px; }
.stat .lab { color: var(--ink-dim); text-transform: uppercase; font-size: 12px; letter-spacing: .06em; }
.track { position: relative; height: 12px; background: var(--panel-2); border-radius: 3px; }
.track i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
.track i.hi { background: linear-gradient(90deg, var(--accent), var(--accent-hi)); }
.track .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-dim); opacity: .6; }
.track .flr { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--warn); }
.stat .val { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--ink-dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.exo { color: var(--exo); font-weight: 600; }
.good { color: var(--good); } .bad { color: var(--bad); }
.wslots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.wslots.two { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 900px) { .wslots, .wslots.two { grid-template-columns: 1fr; } }
.wpick { border-top: 1px solid var(--line); padding: 12px 0; }
.wpick:first-of-type { border-top: 0; padding-top: 4px; }
.wtop { display: flex; gap: 10px; align-items: flex-start; }
.wgrade { flex: none; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; font-weight: 800; border: 1.5px solid currentColor; color: var(--ink-dim); }
.wgrade.sm { width: 24px; height: 24px; font-size: 13px; border-radius: 6px; }
.wgrade.good { color: var(--good); } .wgrade.acc { color: var(--accent-hi); } .wgrade.bad { color: var(--bad); } .wgrade.exo { color: var(--exo); }
.chip.hit { border-color: var(--good); color: var(--good); }
.swap { margin: 8px 0 0; color: var(--warn); }
.ico { flex: none; display: inline-block; width: 40px; height: 40px; border-radius: 4px; border: 2px solid #5b5f6b; background: #1c2030 center/cover; overflow: hidden; vertical-align: middle; }
.ico.big { width: 52px; height: 52px; } .ico.sm { width: 28px; height: 28px; border-width: 1px; }
.ico.exo { border-color: #ceae33; } .ico.leg { border-color: #6f4ea0; }
.ico img { width: 100%; height: 100%; display: block; }
.icell { display: flex; gap: 10px; align-items: center; } .icell > div { min-width: 0; }
.icorow { display: flex; gap: 4px; margin-bottom: 4px; } .icorow .ico { width: 30px; height: 30px; border-width: 1px; }
.plans { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.plan { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.plan select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.pstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.pstats span { background: var(--panel); border-radius: 6px; padding: 4px 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pstats span.hi { color: var(--accent-hi); } .pstats small { display: block; font-size: 10px; font-weight: 600; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .05em; }
.pstats em { font-style: normal; font-size: 11px; margin-left: 4px; }
.lockrow .ico { width: 28px; height: 28px; border-width: 1px; }
.charscreen { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(300px, 1.5fr) minmax(200px, 1fr); gap: 16px; align-items: start; border-top: 3px solid var(--el); }
@media (max-width: 1100px) { .charscreen { grid-template-columns: 1fr; } .charscreen .cs-mid { order: -1; } }
.cs-col { display: flex; flex-direction: column; gap: 8px; }
.slot { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: inherit; position: relative; }
button.slot:hover { border-color: var(--accent); } button.slot .chg { position: absolute; right: 8px; top: 8px; font-size: 11px; color: var(--accent-hi); font-weight: 700; opacity: 0; } button.slot:hover .chg, button.slot:focus-visible .chg { opacity: 1; }
.slot .sl { display: flex; flex-direction: column; min-width: 0; } .slot .sl small { font-size: 11px; color: var(--ink-dim); } .slot .sl b { font-size: 14px; line-height: 1.25; } .slot .lk { color: var(--accent-hi); }
.slot.ws { cursor: default; } .tipt { color: var(--warn); }
.cs-banner { display: flex; gap: 10px; align-items: center; min-height: 64px; padding: 10px 12px; border-radius: 10px; background: linear-gradient(100deg, #2a3478, #485cc7) center/cover; color: #fff; }
.cs-banner b { font-family: var(--display); font-size: 22px; display: block; line-height: 1.1; } .cs-banner span { font-size: 13px; opacity: .9; } .cs-banner .ico { border-color: rgba(255,255,255,.5); }
.stats2 { display: flex; flex-direction: column; gap: 7px; }
.s2 { display: grid; grid-template-columns: 64px 1fr 92px; gap: 10px; align-items: center; font-size: 13px; }
.s2 .lab { color: var(--ink-dim); font-weight: 600; } .s2 .val { text-align: right; font-variant-numeric: tabular-nums; } .s2 .val b.hi { color: var(--accent-hi); }
.track2 { position: relative; height: 12px; background: var(--panel-2); border-radius: 3px; border: 1px solid var(--line); }
.track2 i { position: absolute; top: 0; bottom: 0; } .track2 i.now { left: 0; background: var(--accent); border-radius: 2px 0 0 2px; }
.track2 i.add { background: repeating-linear-gradient(135deg, #9fb0f5 0 4px, #c9d3fb 4px 8px); }
.track2 .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-dim); opacity: .6; }
.track2 .tgt { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1px; background: var(--warn); border-radius: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--ink-dim); align-items: center; }
.legend i { display: inline-block; width: 14px; height: 9px; margin-right: 5px; vertical-align: middle; border-radius: 2px; }
.legend i.now { background: var(--accent); } .legend i.add { background: repeating-linear-gradient(135deg, #9fb0f5 0 3px, #c9d3fb 3px 6px); } .legend i.tgtk { width: 3px; height: 12px; background: var(--warn); }
.warnt { color: var(--warn); }
details.fold > summary { cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 18px; }
.modal { position: fixed; inset: 0; background: rgba(10,14,40,.55); z-index: 50; display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--panel); border-radius: 12px; padding: 16px 18px; width: min(820px, 100%); max-height: 86vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.pick { display: flex; gap: 10px; align-items: center; text-align: left; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: inherit; }
.pick > span { display: flex; flex-direction: column; min-width: 0; } .pick:hover, .pick.on { border-color: var(--accent); } .pick.on { background: var(--sel); }
.tgtbox summary { cursor: pointer; font-weight: 700; } .tgtrow { display: grid; grid-template-columns: 62px 1fr 34px; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }
.tgtrow input { accent-color: var(--accent); width: 100%; } .tgtrow b { text-align: right; font-variant-numeric: tabular-nums; }
.jgrid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; align-items: start; } .jgrid .side { position: sticky; top: 10px; }
@media (max-width: 960px) { .jgrid { grid-template-columns: 1fr; } .jgrid .side { position: static; order: -1; } }
ol.road { list-style: none; margin: 8px 0 0; padding: 0; position: relative; }
ol.road::before { content: ""; position: absolute; left: 15px; top: 8px; bottom: 8px; width: 3px; background: var(--line); border-radius: 2px; }
.stop { position: relative; padding: 0 0 12px 46px; }
.stop .dot { position: absolute; left: 0; top: 4px; width: 33px; height: 33px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--panel-2); border: 3px solid var(--line); color: var(--ink-dim); }
.stop.done .dot { background: var(--good); border-color: var(--good); color: #fff; }
.stop.cur .dot { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 5px rgba(72,92,199,.2); }
.stop.todo:not(.cur) > details > summary { opacity: .72; }
.stop details > summary { cursor: pointer; list-style: none; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.stop.cur details > summary { border-color: var(--accent); background: var(--sel); }
.stop details > summary::-webkit-details-marker { display: none; }
.stopbody { padding: 10px 4px 2px; }
ul.wk2 { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
ul.wk2 li { display: flex; flex-direction: column; gap: 3px; } ul.wk2 .pill { align-self: flex-start; }
#pageguide { margin-bottom: 12px; } #pageguide:empty { display: none; }
.guide { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 8px; background: var(--info-bg); color: var(--info-ink); font-size: 14px; }
.guide b { white-space: nowrap; } .guide span { flex: 1; } .guide .btn { flex: none; }
@media (max-width: 700px) { .guide { flex-direction: column; align-items: flex-start; } }
.guidepeek { background: none; border: 0; color: var(--accent-hi); font-size: 12px; text-decoration: underline; padding: 0; }
.chip.on { background: var(--accent); color: #fff; border-color: var(--accent); } button.chip { cursor: pointer; }
.trio { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; align-items: center; margin-bottom: 10px; } .trio > b { grid-column: 1 / -1; }
.champs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px; } @media (max-width: 760px) { .champs { grid-template-columns: 1fr; } }
.champs p { margin: 2px 0 0; }
.hidden-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; } .hidden-grid p { margin: 4px 0 0; }
dl.gloss { display: grid; grid-template-columns: 170px 1fr; gap: 8px 14px; margin: 0; } dl.gloss dt { font-weight: 700; } dl.gloss dd { margin: 0; color: var(--ink-dim); }
@media (max-width: 600px) { dl.gloss { grid-template-columns: 1fr; } dl.gloss dd { margin-bottom: 6px; } }
table.learnt td { vertical-align: top; font-size: 14px; }
.homegrid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; align-items: start; }
@media (max-width: 900px) { .homegrid { grid-template-columns: 1fr; } }
.gearlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 4px; }
.gearlist.guns { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.gear { display: flex; gap: 10px; align-items: center; padding: 6px; border-radius: 8px; background: var(--panel-2); min-width: 0; }
.gear > div { min-width: 0; display: flex; flex-direction: column; } .gear b { font-size: 14px; line-height: 1.25; } .gear.empty { opacity: .6; }
.pstats.six { grid-template-columns: repeat(6, 1fr); } @media (max-width: 560px) { .pstats.six { grid-template-columns: repeat(3, 1fr); } }
.score .big { font-family: var(--display); font-size: 56px; font-weight: 700; line-height: 1; margin: 4px 0 8px; color: var(--accent-hi); }
.mgrid { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.mrow { display: flex; gap: 8px; align-items: center; } .mrow .mcard { flex: 1; margin: 0; }
.mnum { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--panel-2); font-size: 12px; font-weight: 700; color: var(--ink-dim); }
.mrow.ok .mnum { background: var(--good); color: #fff; }
.mcard { display: flex; gap: 10px; align-items: center; margin-top: 8px; padding: 6px; border-radius: 8px; background: var(--panel-2); }
.mcard > div { min-width: 0; display: flex; flex-direction: column; } .mcard b { font-size: 14px; }
.mimg { flex: none; width: 112px; aspect-ratio: 16 / 9; border-radius: 6px; background: var(--ico-bg); overflow: hidden; display: block; }
.mimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
details.howto { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
details.howto summary { cursor: pointer; padding: 6px 10px; font-size: 13px; font-weight: 700; color: var(--accent-hi); list-style: none; }
details.howto summary::before { content: "\25B8  "; } details.howto[open] summary::before { content: "\25BE  "; }
details.howto > :not(summary) { margin: 0 12px 10px; }
details.howto .hsteps p { font-size: 13px; line-height: 1.5; margin: 0 0 6px; } details.howto .hsteps b { color: var(--accent-hi); }
details.howto .links a { white-space: nowrap; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--ink-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
.kv dd { margin: 0; }
.weapons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.wcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; border-top: 3px solid var(--el); display: flex; flex-direction: column; gap: 6px; }
.wcard .slot { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .08em; }
.wcard h4 { font-size: 18px; }
.wcard .perks { font-size: 12px; color: var(--ink-dim); }
.wcard .tip { font-size: 12px; color: var(--warn); }
ol.combo { margin: 0; padding: 0; list-style: none; counter-reset: c; display: grid; gap: 10px; }
ol.combo li { counter-increment: c; display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
ol.combo li::before { content: counter(c); font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--bg); background: var(--accent-hi); border-radius: 6px; height: 26px; display: grid; place-items: center; }
.mods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.mods div { background: var(--panel-2); border-radius: 8px; padding: 10px; font-size: 12px; }
.mods b { display: block; font-family: var(--display); text-transform: uppercase; font-size: 13px; margin-bottom: 4px; color: var(--accent-hi); }
.alts { display: flex; flex-direction: column; }
.alt { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 13px; border-radius: 6px; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.alt[aria-pressed="true"] { background: #232a4a; }
.alt .pct { font-family: var(--mono); color: var(--accent-hi); }
.code { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; word-break: break-all; color: var(--ink-dim); max-height: 90px; overflow: auto; user-select: all; -webkit-user-select: all; }
.note { border-left: 3px solid var(--warn); background: #2a2414; padding: 10px 14px; border-radius: 6px; font-size: 13px; color: #e8d9b0; }
.note.info { border-left-color: var(--accent); background: #1b2140; color: #cfd6f5; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile b { display: block; font-family: var(--display); font-size: 28px; font-variant-numeric: tabular-nums; }
.tile span { color: var(--ink-dim); font-size: 12px; }
.inp { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 13px; }
#syncbtn { display: flex; align-items: center; }
details.camp { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
details.camp summary { cursor: pointer; list-style: none; }
details.camp summary::-webkit-details-marker { display: none; }
ol.mlist { margin: 6px 0 8px; padding-left: 20px; columns: 2; font-size: 13px; color: var(--ink-dim); }
ol.mlist li.ok { color: var(--good); }
ol.mlist li.ok::marker { content: "✓ "; }
ul.wk { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; }
ol.combo li.past { opacity: .55; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 26px; text-align: center; color: var(--ink-dim); }
.drop.over { border-color: var(--accent); background: #1b2140; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.filters button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-hi); }
.steps { display: grid; gap: 12px; }
.step { display: grid; grid-template-columns: 40px 1fr; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.step .n { font-family: var(--display); font-size: 26px; font-weight: 700; color: var(--accent-hi); line-height: 1; }
.step h3 { font-size: 19px; margin-bottom: 4px; }
.step p { margin: 4px 0; color: var(--ink-dim); max-width: 75ch; }
.meter { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; min-width: 70px; }
.meter i { display: block; height: 100%; background: var(--accent); }
.busy { display: inline-flex; gap: 8px; align-items: center; color: var(--ink-dim); font-size: 13px; }
.busy::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
.toast.show { opacity: 1; }
noscript .panel { margin: 40px auto; max-width: 720px; }
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; } .controls { position: static; max-height: none; }
  .weapons, .mods { grid-template-columns: 1fr 1fr; } .grid2 { grid-template-columns: 1fr; }
  .bestgrid { grid-template-columns: 1fr; } .tiles { grid-template-columns: 1fr 1fr !important; }
  #tab-build .layout > #results { order: -1; }
}
@media (max-width: 560px) { .weapons, .mods { grid-template-columns: 1fr; } .kv { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
body.locked .wrap { display: none; }
.gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.gate .panel { max-width: 380px; width: 100%; text-align: center; }
.gate input { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 12px; margin: 14px 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg, #0c0e14); color: inherit; }
.gate .err { color: #e5786d; min-height: 20px; font-size: 13px; }

/* ===== Theme: "field guide". Cool paper pages, indigo ink, brand-blue cover band with index tabs.
   Light by default, ink-blue at night via the device's dark mode. Sentence case throughout. ===== */
:root {
  --paper: #E9ECF4; --bg: #E9ECF4; --panel: #FBFCFE; --panel-2: #F0F2F8; --line: #CDD3E4;
  --ink: #1B1F3B; --ink-dim: #5A6080; --accent: #485cc7; --accent-hi: #3346B0; --cover: #485cc7; --cover-ink: #FFFFFF;
  --good: #1F8A5B; --warn: #B7791F; --bad: #C2453D; --exo: #9A7210;
  --solar: #D2691E; --void: #8A4FD0; --arc: #1E8FB8; --strand: #2E9E52; --stasis: #4A6FE0; --prismatic: #B44DBD;
  --sel: #E3E7F6; --note-bg: #FBF3E2; --note-ink: #5C4310; --info-bg: #E6EAF9; --info-ink: #24306E; --ico-bg: #D9DDEA;
  --display: "Chakra Petch", "Arial Narrow", sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "Figtree", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12152A; --bg: #12152A; --panel: #1A1E38; --panel-2: #222747; --line: #2F3563;
    --ink: #E7E9F5; --ink-dim: #9DA3C6; --accent: #485cc7; --accent-hi: #8E9CF0; --cover: #33429A;
    --good: #46BE86; --warn: #DDA94A; --bad: #E06A62; --exo: #E3C06A;
    --solar: #F08A2C; --void: #A971E6; --arc: #5FC7E8; --strand: #52C673; --stasis: #7A97F2; --prismatic: #E3A6E8;
    --sel: #29306A; --note-bg: #2B2516; --note-ink: #EADBB0; --info-bg: #1E2550; --info-ink: #D3D9F7; --ico-bg: #22273F;
    color-scheme: dark;
  }
}
body { overflow-x: clip; font-size: 15.5px; }

.ico { background-color: var(--ico-bg); border-color: #8C91A6; } .ico.exo { border-color: #C9A227; } .ico.leg { border-color: #7A57B0; }
.btn:hover { background: var(--accent-hi); }
.gate .err { color: var(--bad); }
body.locked { background: var(--cover); } .gate .panel { box-shadow: 0 18px 50px rgba(10,14,40,.35); border: 0; }

/* the cover band: the one loud thing on the page */
.cover { margin: 0 calc(50% - 50vw) 18px; padding: 0 calc(50vw - 50%); background: var(--cover); color: var(--cover-ink); }
.cover header.top { border-bottom: 0; padding: 22px 0 18px; }

async function analyze() {
  const keep = new Set(), usage = { raid: {}, pve: {}, pvp: {} }, setcombo = { raid: {}, pve: {}, pvp: {} }, mwq = {};
  for (const t of TPL()) for (const m of CFG.modes) {
    if (!t.weights[m]) continue;
    const r = solve({ tid: t.id, mode: m, exotic: "template", locks: {}, excluded: new Set(), useFull: true });
    r.builds.forEach((b, rank) => {
      b.pieces.forEach(p => { usage[m][p.id] = (usage[m][p.id] || 0) + 1; if (rank < 3) keep.add(p.id);
        if (rank === 0 && p.tier >= 1 && p.mw < 5) { (mwq[p.id] = mwq[p.id] || { p, builds: new Set() }).builds.add(t.name); } });
      const k = b.sets.map(s => s.count + "pc " + s.set).join(" + ") || "No set bonus"; setcombo[m][k] = (setcombo[m][k] || 0) + 1;
    });
    await new Promise(res => setTimeout(res, 0));
  }
  const prot = x => x.loadouts.length ? "In DIM loadout: " + x.loadouts.join(", ") : x.locked ? "Locked in game" : (x.tag === "favorite" || x.tag === "keep") ? "Tagged " + x.tag : null;
  const junk = [], review = [], kept = [];
  const exoGroup = {}; H.filter(a => a.rarity === "Exotic").forEach(a => (exoGroup[a.label] = exoGroup[a.label] || []).push(a));
  for (const a of H) {
    const why = prot(a), e = { item: a, kind: "armor" };
    if (keep.has(a.id)) { kept.push({ ...e, reason: "Used in a top-3 recommended build" }); continue; }
    if (a.rarity === "Exotic") {
      const bt = Math.max(...exoGroup[a.label].map(g => g.tier));
      if (a.tier < bt) (why ? review : junk).push({ ...e, reason: `Older copy; you own this exotic at Tier ${bt}` + (why ? ` (${why})` : "") });
      else kept.push({ ...e, reason: "Best copy of this exotic" });
      continue;
    }
    let reason;
    if (a.tier === 0) reason = "Legacy armor (pre-Armor 3.0): trails Tier 5 by 15 to 25 stat points and has no set bonus";
    else if (a.tier <= 4 && H.some(b => b.slot === a.slot && b.tier === 5 && b.set === a.set && b.rarity !== "Exotic")) reason = `Tier ${a.tier}; you have a Tier 5 ${a.set || "piece"} for this slot`;
    else if (a.tier <= 2) reason = `Tier ${a.tier}: too low to compete with Tier 5`;
    else { review.push({ ...e, reason: "Not used in any top build, but no strictly better copy. Your call." }); continue; }
    (why ? review : junk).push({ ...e, reason: reason + (why ? ` (${why})` : "") });
  }

    const tt = Math.max(...cs.map(c => c.tier));
    cs.forEach(c => { if (c.tier < tt && c.tier <= 2 && !c.crafted) { const why = prot(c); (why ? review : junk).push({ item: c, kind: "weapon", reason: `Duplicate; you own a Tier ${tt} copy` + (why ? ` (${why})` : "") }); } });
  }
  const t5 = {}; H.forEach(a => { if (a.tier === 5 && a.set) (t5[a.set] = t5[a.set] || new Set()).add(a.slot); });
  ANALYSIS = { junk, review, kept, usage, setcombo,
    mwq: Object.values(mwq).sort((a, b) => b.builds.size - a.builds.size),
    gaps: ["Iron Battalion", "Luminopotent", "Triumphal Anthem"].map(s => [s, SLOTS.filter(x => !(t5[s] || new Set()).has(x))]),
    hasSlacks: !CHASE() || H.some(a => a.name === CHASE().name) };

}

function wMeta(name, mode) {

    WSLOTS.forEach(s => { const i = t.weapons[s].indexOf(name); if (i < 0) return;
      const f = (t.fit[mode] || t.fit.raid || 50) - i * 3; if (!best || f > best.fit) best = { fit: f, t }; }); });

}
function wGrade(w, mode) {

  if (w.perksKnown === false) return { g: "?", label: "Perks not loaded", cls: "", act: [], swap: [] };
  const act = [...new Set(w.perks.filter(p => good.has(p)))], swap = act.length >= 2 ? [] : [...new Set(w.optional.filter(p => good.has(p) && !w.perks.includes(p)))].slice(0, 3);
  const n = act.length + swap.length;
  if (w.rarity === "Exotic") return { g: "X", label: "Exotic", cls: "exo", act, swap };
  if (n >= 2) return { g: "A", label: "Strong roll", cls: "good", act, swap };
  if (n === 1) return { g: "B", label: "One good perk", cls: "acc", act, swap };

function champOf(w) {
  if (w.rarity === "Exotic") return null;
  const p = (w.perks || []).join(" | "), t = w.type || "";
  if (/Caster Frame/.test(p)) return "Barrier"; if (/Vortex Frame/.test(p)) return "Overload"; if (/Wave Frame/.test(p)) return "Unstoppable";
  if (/Area Denial/.test(p)) return "Overload"; if (/Heavy Burst/.test(p) || /Rocket-Assisted/.test(p) || /Sidearm/.test(t)) return "Unstoppable";
  if (/Precision Frame|Adaptive Frame|Adaptive Burst|Precision/.test(p)) return "Barrier";
  if (/Lightweight Frame|Rapid-Fire Frame|Lightweight/.test(p)) return "Overload";
  if (/Aggressive Frame|High-Impact Frame|Aggressive Burst|Aggressive/.test(p)) return "Unstoppable";
  return null;
}

    if (n.kind === "Power") return `<p class="d12" style="margin:0">${esc(n.br.text)}</p>${howto("power")}`;
    return `<p class="d12" style="margin:0">${esc(n.ch.short)}</p>${howto(n.ch.guide || "engram", n.ch.name)}`;
  };
  el.innerHTML = `
  ${note ? `<div class="note" style="margin-bottom:14px">${esc(note)}</div>` : ""}
  ${LIVE.busy && LIVE.progress ? `<div class="panel" style="margin-bottom:14px"><span class="busy" id="liveprog">${esc(LIVE.progress)}</span></div>` : ""}
  <div class="jgrid">
    <div class="panel"><div class="sec-h"><h2 style="font-size:24px">Your road to 550</h2><small>${nodes.filter(n => n.state === "done").length} of ${nodes.length} stops done</small></div>
      ${nodes.length ? `<ol class="road">${nodes.map((n, i) => `<li class="stop ${n.state} ${n.current ? "cur" : ""}">
        <span class="dot" aria-hidden="true">${icon(n)}</span>
        <details ${n.current ? "open" : ""}><summary><span class="row" style="justify-content:space-between;width:100%;flex-wrap:nowrap">
          <span><small class="d12">${esc(n.kind)}</small><br><b>${esc(n.title)}</b></span>
          ${n.current ? `<span class="pill acc">You are here</span>` : n.state === "done" ? `<span class="pill good">Done</span>` : n.state === "partial" ? `<span class="pill warn">In progress</span>` : ""}</span></summary>
          <div class="stopbody">${body(n)}</div></details></li>`).join("")}</ol>` : `<p class="dim">Load your data to see your road.</p>`}
      <p class="d12" style="margin:10px 0 0"><b>Coming back later:</b> ${VAULTED.join(", ")}. Bungie is restoring these; its current estimate is early 2028.</p></div>
    <div class="stack side">
      <div class="panel"><div class="sec-h"><h3>At a glance</h3></div>
        <div class="tiles" style="grid-template-columns:1fr 1fr">
          <div class="tile"><span>Power</span><b>${POWER || "?"} <span class="d12">/ 550</span></b><div class="meter" style="margin-top:6px"><i style="width:${(POWER || 0) / 5.5}%"></i></div></div>
          <div class="tile"><span>Campaigns</span><b>${doneCount} <span class="d12">/ ${CAMPAIGNS.length}</span></b><div class="meter" style="margin-top:6px"><i style="width:${doneCount / CAMPAIGNS.length * 100}%"></i></div></div></div>
        ${cur ? `<p style="margin:10px 0 0"><b>Next stop:</b> ${esc(cur.title)}</p>` : `<p style="margin:10px 0 0"><b>You've finished the road.</b> Keep farming Tier 5 gear and pinnacles.</p>`}
        <div class="row" style="margin-top:10px">${live ? `<button class="btn sm" id="scanbtn">${JOURNEY.scannedAt ? "Rescan my story" : "Scan my story"}</button>` : `<button class="btn sm" data-live="signin">Sign in to detect progress</button>`}
          <button class="btn ghost sm" id="jcopy">Copy journey data</button></div>
        <p class="d12" style="margin:6px 0 0">${JOURNEY.scannedAt ? "Last scan " + new Date(JOURNEY.scannedAt).toLocaleDateString() + "." : "Your story progress hasn't been scanned yet."}</p></div>
      <div class="panel"><div class="sec-h"><h3>This week</h3><small>${WEEK ? "Ranked for you" : "Sign in to load"}</small></div>
        ${plan.length ? `<p class="d12" style="margin:0 0 8px">Short on time? Do the top two. They move your Power or get gear your builds need.</p>
          <ul class="wk2">${plan.slice(0, 10).map(i => `<li><span class="pill ${i.tag === "Do first" ? "acc" : ""}">${esc(i.tag)}</span><b>${esc(i.name)}</b><span class="d12">${esc(i.why)}${i.acts.length ? " (" + esc(i.acts.slice(0, 2).join(", ")) + ")" : ""}</span></li>`).join("")}</ul>`
          : `<p class="d12">Once you're signed in, this week's featured activities show up here, ranked by what helps you most.</p>`}</div>
    </div>
  </div>`;
  const sb = $("scanbtn"); if (sb) sb.onclick = () => scanCampaigns();
  $("jcopy").onclick = () => copy(journeyData(), "Journey data copied. Paste it to Claude.");
  el.querySelectorAll("[data-camp]").forEach(s => s.onchange = () => { const o = overrides(); if (s.value) o[s.dataset.camp] = s.value; else delete o[s.dataset.camp]; LS.set("hle-camp-override", o); renderJourney(); });
  setTimeout(fillMissions, 60);
}

/* ============ Data tab ============ */
function renderImport(msg) {
  const c = bnetCfg(), tok = getToken(), haveKeys = c.apiKey && c.clientId;
  const keyForm = `<div class="stack" style="gap:8px">
      <p class="d12" style="margin:0">Find both on your app's page at <b>bungie.net/en/Application</b>. They're saved only in this browser.</p>
      <label class="lbl" for="k-api">API Key</label><input id="k-api" class="inp" autocomplete="off" spellcheck="false" value="${esc(c.apiKey || "")}" placeholder="32 letters and numbers">
      <label class="lbl" for="k-client">OAuth client_id</label><input id="k-client" class="inp" autocomplete="off" inputmode="numeric" value="${esc(c.clientId || "")}" placeholder="numbers only">
      <div class="row"><button class="btn" data-live="savekeys">Save</button></div></div>`;
  const status = LIVE.busy ? `<p><span class="busy" id="liveprog">${esc(LIVE.progress || "Working…")}</span></p>`
    : tok ? `<p>Signed in${LIVE.account ? " as <b>" + esc(LIVE.account) + "</b>" : ""}. ${DATA_SOURCE === "live" ? esc(DATA_LABEL) + "." : ""}</p>
      <div class="row"><button class="btn" data-live="refresh">Refresh from Bungie</button><button class="btn ghost" data-live="signout">Sign out</button></div>`
    : `<p class="d12">Not signed in. Bungie sign-ins last about an hour; after that, one click signs you back in.</p>
      <div class="row"><button class="btn" data-live="signin">Sign in with Bungie</button></div>`;
  $("tab-import").innerHTML = `<div class="grid2">
    <div class="panel stack"><div class="sec-h"><h3>Live from Bungie</h3><small>${DATA_SOURCE === "live" ? "Connected" : "Recommended"}</small></div>
      ${(!haveKeys || c.editing) ? keyForm : status}
      ${LIVE.error ? `<div class="note">Something went wrong: ${esc(LIVE.error)}<br><span class="d12">Click Copy debug info and paste it to Claude.</span></div>` : ""}
      ${msg ? `<div class="note ${msg.ok ? "info" : ""}">${esc(msg.text)}</div>` : ""}
      <div class="row">${haveKeys && !c.editing ? `<button class="btn ghost sm" data-live="editkeys">${c.builtin ? "Use my own keys" : "Change keys"}</button>` : ""}<button class="btn ghost sm" data-live="debug">Copy debug info</button><button class="btn ghost sm" data-live="cleardefs">Clear item cache</button></div></div>
    <div class="panel stack"><div class="sec-h"><h3>Or load a DIM export</h3><small>Backup option</small></div>
      <div class="drop" id="drop"><p style="margin:0 0 10px"><b>Drop your DIM CSVs here</b><br><span class="d12">Armor is required, Weapons optional. DIM exports include your DIM loadouts, which makes Auto-clear safer.</span></p>
        <label class="btn" for="files">Choose files</label><input type="file" id="files" accept=".csv,text/csv" multiple class="hidden"></div>
      <p class="d12" style="margin:0">In DIM: Settings, Spreadsheets, then Armor and Weapons.</p>
      <div class="row"><button class="btn ghost sm" id="resetdata">Clear saved data from this browser</button></div></div></div>`;
  const drop = $("drop"), inp = $("files");
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => handleFiles(e.dataTransfer.files));
  inp.addEventListener("change", () => handleFiles(inp.files));
  $("resetdata").onclick = () => { ["hle-armor", "hle-weapons", "hle-label", "hle-live", "hle-token"].forEach(k => LS.del(k)); location.reload(); };
}
async function handleFiles(files) {
  let armor = null, weapons = null;
  for (const f of files) { const txt = await f.text(); const k = kindOf(parseCSV(txt.split(/\r?\n/).slice(0, 3).join("\n"))); if (k === "armor") armor = txt; else if (k === "weapons") weapons = txt; }
  if (!armor) { renderImport({ ok: false, text: "No armor export found. Choose the Armor CSV from DIM (Settings, Spreadsheets, Armor)." }); return; }
  try {
    const label = "DIM export loaded " + new Date().toLocaleString();
    const prevW = (() => { try { return localStorage.getItem("hle-weapons"); } catch (e) { return null; } })();
    loadData(armor, weapons || prevW || "", label);
    try { localStorage.setItem("hle-armor", armor); if (weapons) localStorage.setItem("hle-weapons", weapons); localStorage.setItem("hle-label", label); } catch (e) {}
    LS.del("hle-live");
    st.locks = {}; st.excluded.clear(); if (!["template", "any", "none"].includes(st.exotic)) st.exotic = "template";
    renderImport({ ok: true, text: `Loaded ${H.length} ${CLS} armor pieces${weapons ? " and " + WEAPONS.length + " weapons" : ""}. Everything is recalculating.` });
    rerun(); analyzeSoon(); runBest();
  } catch (e) { renderImport({ ok: false, text: e.message }); }
}
function analyzeSoon() {
  ["tab-clear", "tab-synergy", "tab-roadmap"].forEach(id => $(id).innerHTML = `<div class="panel"><span class="busy">Running every build to find your core pieces and junk…</span></div>`);
  setTimeout(() => analyze().catch(e => { $("tab-clear").innerHTML = `<div class="panel">Analysis failed: ${esc(e.message)}</div>`; }), 50);
}
function renderEmpty() {
  const msg = `<div class="panel" style="max-width:720px"><h2 style="font-size:26px">Connect your Guardian</h2>
    <p class="dim">Sign in with Bungie to load your live inventory, or drop in a DIM export. Everything stays in this browser.</p>
    <button class="btn" id="godata">Get started</button></div>`;
  $("tab-best").innerHTML = msg; $("results").innerHTML = msg; renderHome(); $("controls").innerHTML = "";
  ["tab-clear", "tab-synergy", "tab-roadmap"].forEach(id => $(id).innerHTML = msg);
  renderJourney();
  document.querySelectorAll("#godata").forEach(b => b.onclick = () => document.querySelector('nav.tabs button[data-tab="import"]').click());
  $("dataline").textContent = "No data loaded yet.";
}
async function boot() {
  renderHeaderSync(); renderImport();
  let redirected = false;
  try { redirected = await handleRedirect(); } catch (e) { LIVE.error = e.message; dbg("ERROR " + e.message); }
  const cached = LS.get("hle-live", null);
  let loaded = false;
  if (cached && cached.armor && cached.armor.length) { try { setData(cached.armor, cached.weapons, cached.label + " (saved)", "live", cached.powers || cached.power, cached.lastClass); LIVE.mem = cached.mem || null; LIVE.chars = cached.chars || {}; LIVE.charIds = cached.charIds || []; LIVE.account = cached.account || null; loaded = true; } catch (e) {} }
  if (!loaded) {
    try { const a = localStorage.getItem("hle-armor"); if (a) { loadData(a, localStorage.getItem("hle-weapons") || "", localStorage.getItem("hle-label") || "Your last DIM export"); loaded = true; } } catch (e) {}
  }
  if (loaded) { rerun(); analyzeSoon(); runBest(); } else renderEmpty();
  renderJourney();
  if (redirected || (getToken() && !cached)) { document.querySelector('nav.tabs button[data-tab="' + (loaded ? "home" : "import") + '"]').click(); loadLive(); }
  else if (!loaded) document.querySelector('nav.tabs button[data-tab="import"]').click();
  renderImport(); renderHeaderSync();
}
const GATE_HASH = "6b2ed9b8661ebc0aac4903d1ec8601f13db7a4d0d631baee5e9747becf15b8d8", GATE_SALT = "d2nb-v1:";
async function gateHash(pw) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(GATE_SALT + pw)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
function gateOpen() { document.body.classList.remove("locked"); const g = $("gate"); if (g) g.remove(); loadUI(); boot(); }
(function gate() {
  let saved = null; try { saved = localStorage.getItem("hle-gate"); } catch (e) {}
  if (saved === GATE_HASH) { gateOpen(); return; }
  $("gateform").onsubmit = async e => { e.preventDefault();
    const h = await gateHash($("gatepw").value);
    if (h === GATE_HASH) { try { localStorage.setItem("hle-gate", h); } catch (e) {} gateOpen(); }
    else { $("gateerr").textContent = "Wrong password."; $("gatepw").select(); } };
})();
</script>
